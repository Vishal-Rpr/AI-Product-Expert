name: Swing Trading Alert

on:
  schedule:
    # 08:12 AM IST Mon-Fri (NSE days). Not 08:00 — daily-digest already owns
    # 02:30 UTC, and GitHub drops colliding scheduled jobs under load.
    # Changing this cron also reactivates a scheduled workflow GitHub has
    # deactivated (manual Run workflow does not).
    - cron: "12 8 * * 1-5"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

jobs:
  send-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: swing_alert/requirements.txt

      - name: Install dependencies
        run: pip install -r swing_alert/requirements.txt

      - name: Run swing alert
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POSITIONS_SHEET_ID: ${{ secrets.POSITIONS_SHEET_ID }}
          PREDICTIONS_SHEET_ID: ${{ secrets.PREDICTIONS_SHEET_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          CAPITAL_INR: ${{ secrets.CAPITAL_INR }}
          RISK_PER_TRADE_PCT: ${{ secrets.RISK_PER_TRADE_PCT }}
        run: python swing_alert/alert.py
