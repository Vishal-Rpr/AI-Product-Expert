# Swing alert universe
# ---------------------
# Two sections:
#   sector_indices: NSE sectoral/thematic indices + their Yahoo tickers, used for RS ranking
#   stocks: eligible small/mid-cap stocks tagged by sector, with a 1-line description
#
# To extend: add more stocks under `stocks:` with sector, ticker (Yahoo NSE format = SYMBOL.NS), and a short description
# Refresh quarterly to reflect NSE index reconstitutions.

benchmark:
  name: "Nifty 50"
  ticker: "^NSEI"

# Yahoo Finance tickers for NSE sectoral/thematic indices.
# NOTE: Yahoo's ^CNX* index tickers return metadata only via yfinance (no price history).
# We proxy each sector via a highly-liquid ETF that tracks the same index (returns match within a few bps).
# This preserves relative-strength ranking accuracy and works reliably in headless GitHub Actions.
sector_indices:
  - name: "Nifty Midcap 150"
    ticker: "MIDCAPETF.NS"          # ICICI Prudential Nifty Midcap 150 ETF
  - name: "Nifty Smallcap 250"
    ticker: "SMALLCAP.NS"           # Motilal Oswal Nifty Smallcap 250 ETF
  - name: "Nifty Auto"
    ticker: "AUTOBEES.NS"           # Nippon India Nifty Auto ETF
  - name: "Nifty PSU Bank"
    ticker: "PSUBNKBEES.NS"         # Nippon India Nifty PSU Bank ETF
  - name: "Nifty Bank"
    ticker: "BANKBEES.NS"           # Nippon India Nifty Bank ETF
  - name: "Nifty Realty"
    ticker: "MOREALTY.NS"           # Motilal Oswal Nifty Realty ETF
  - name: "Nifty Pharma"
    ticker: "PHARMABEES.NS"         # Nippon India Nifty Pharma ETF
  - name: "Nifty Metal"
    ticker: "METALIETF.NS"          # ICICI Prudential Nifty Metal ETF
  - name: "Nifty India Defence"
    ticker: "MODEFENCE.NS"          # Motilal Oswal Nifty India Defence ETF
  - name: "Nifty Financial Services"
    ticker: "FINIETF.NS"            # ICICI Prudential Nifty Financial Services ETF
  - name: "Nifty IT"
    ticker: "ITBEES.NS"             # Nippon India Nifty IT ETF
  - name: "Nifty Infra"
    ticker: "INFRABEES.NS"          # Nippon India Nifty Infrastructure ETF
  - name: "Nifty FMCG"
    ticker: "FMCGIETF.NS"           # ICICI Prudential Nifty FMCG ETF
  - name: "Nifty Consumer Durables"
    ticker: "CONSUMBEES.NS"         # Nippon India Nifty Consumer Durables ETF

# Curated small/mid-cap stock universe.
